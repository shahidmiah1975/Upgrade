```yaml name=.github/workflows/dotnet-build.yml
name: .NET Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    name: Build (detect solution or projects)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Find solution file
      id: find_sln
      run: |
        set -e
        sln=$(ls *.sln 2>/dev/null || true)
        if [ -z "$sln" ]; then
          sln=$(find . -maxdepth 5 -name "*.sln" | head -n1 || true)
        fi
        if [ -z "$sln" ]; then
          echo "no_sln=true" >> $GITHUB_OUTPUT
          echo "No solution file found; will search for csproj files instead."
        else
          echo "solution=$sln" >> $GITHUB_OUTPUT
          echo "Found solution: $sln"
        fi

    - name: Find csproj files
      id: find_projects
      if: steps.find_sln.outputs.no_sln == 'true'
      run: |
        projs=$(find . -maxdepth 6 -name "*.csproj" | tr '\n' ' ' || true)
        if [ -z "$projs" ]; then
          echo "no_proj=true" >> $GITHUB_OUTPUT
          echo "No csproj files found."
        else
          echo "projects=$projs" >> $GITHUB_OUTPUT
          echo "Found projects: $projs"
        fi

    - name: Restore NuGet packages (solution)
      if: steps.find_sln.outputs.no_sln != 'true'
      run: dotnet restore "${{ steps.find_sln.outputs.solution }}"

    - name: Restore NuGet packages (projects)
      if: steps.find_sln.outputs.no_sln == 'true' && steps.find_projects.outputs.no_proj != 'true'
      run: |
        for p in ${{ steps.find_projects.outputs.projects }}; do
          echo "Restoring $p"
          dotnet restore "$p"
        done

    - name: Build solution
      if: steps.find_sln.outputs.no_sln != 'true'
      run: dotnet build "${{ steps.find_sln.outputs.solution }}" --configuration Release --no-restore

    - name: Build projects
      if: steps.find_sln.outputs.no_sln == 'true' && steps.find_projects.outputs.no_proj != 'true'
      run: |
        for p in ${{ steps.find_projects.outputs.projects }}; do
          echo "Building $p"
          dotnet build "$p" --configuration Release --no-restore
        done

    - name: Run tests (solution)
      if: steps.find_sln.outputs.no_sln != 'true'
      run: |
        set -e || true
        tests=$(find . -type f -name "*Tests*.csproj" -or -name "*Test*.csproj" | tr '\n' ' ')
        if [ -z "$tests" ]; then
          echo "No test projects found; skipping tests."
        else
          for t in $tests; do
            dotnet test "$t" --no-build --verbosity normal
          done
        fi

    - name: Run tests (projects)
      if: steps.find_sln.outputs.no_sln == 'true' && steps.find_projects.outputs.no_proj != 'true'
      run: |
        set -e || true
        tests=$(find . -type f -name "*Tests*.csproj" -or -name "*Test*.csproj" | tr '\n' ' ')
        if [ -z "$tests" ]; then
          echo "No test projects found; skipping tests."
        else
          for t in $tests; do
            dotnet test "$t" --no-build --verbosity normal
          done
        fi
```
